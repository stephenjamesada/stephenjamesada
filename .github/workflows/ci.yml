name: CI

on:
  push:
  pull_request:

jobs:
  markdown:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mdformat
        run: |
          pip install mdformat mdformat-gfm mdformat-frontmatter
          mdformat --version

      - name: Check formatting
        run: |
          mdformat --diff README.md
          mdformat --check README.md
